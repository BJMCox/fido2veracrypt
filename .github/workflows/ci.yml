name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Format, lint, and test (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  linux:
    name: Lint and test, with real VeraCrypt (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
    env:
      # VeraCrypt 1.26.30's console package, signed by the VeraCrypt Team key
      # 5069A233D55A0EEB174A5FC3821ACD02680D16DE. The hash pins the checked file.
      VERACRYPT_DEB: veracrypt-console-1.26.30-Ubuntu-24.04-amd64.deb
      VERACRYPT_SHA256: 830462c50f3daed38ba9b206cf2804e8134305bb8cd4e1d6beba160e93ef2fbd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hidapi's build dependency, exfatprogs, and VeraCrypt
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev exfatprogs
          curl -fsSL -o "$VERACRYPT_DEB" "https://github.com/veracrypt/VeraCrypt/releases/download/VeraCrypt_1.26.30/$VERACRYPT_DEB"
          echo "$VERACRYPT_SHA256  $VERACRYPT_DEB" | sha256sum -c -
          sudo apt-get install -y "./$VERACRYPT_DEB"
      - name: Load the kernel's exFAT driver
        # GitHub's runners use a cloud kernel whose exFAT driver ships in linux-modules-extra.
        run: |
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe exfat
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test with real VeraCrypt
        run: FIDO2VERACRYPT_IT=1 cargo test --locked --test veracrypt -- --nocapture

  audit:
    name: Check dependencies for advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit
