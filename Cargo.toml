[package]
name = "fido2veracrypt"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Jessica Cox <jmcox@posteo.de>"]
description = "Opens VeraCrypt containers with a FIDO2 security key"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1"
fido2kit = { git = "https://github.com/BJMCox/fido2kit.git", rev = "cde3c421a5b6c562ed238e251742b53bec36be92" }
getrandom = "0.4"
rpassword = "7"
toml = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
